<title>플리에 스튜디오 예약 데모</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 상단 고정 안내 띠 + 고객/관리자 전환. 고객은 5단계 예약 흐름, 관리자는 예약·요금·알림 3탭. */
:root{
  --bg:#f2f3f7; --surface:#ffffff; --fg:#1d2033; --muted:#61657d; --line:#dcdee8;
  --accent:#a8325c; --accent-fg:#ffffff; --accent-soft:#f6e3ea; --slate:#3b5878;
  --ok:#1f7a4d; --ok-soft:#dff2e8; --warn:#8a5a00; --warn-soft:#fbefd2; --bad:#a3262a; --bad-soft:#f9dfe0;
  --font-display:'Gowun Batang','Noto Serif KR',serif; --font-body:'Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13141e; --surface:#1c1e2c; --fg:#ebe9f3; --muted:#a2a5bc; --line:#2f3248;
  --accent:#e58aa9; --accent-fg:#2a0f19; --accent-soft:#3a2230; --slate:#8fb0d4;
  --ok:#6fd3a0; --ok-soft:#1d3a2e; --warn:#f0c46a; --warn-soft:#3b3014; --bad:#f19a9d; --bad-soft:#40201f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13141e; --surface:#1c1e2c; --fg:#ebe9f3; --muted:#a2a5bc; --line:#2f3248;
  --accent:#e58aa9; --accent-fg:#2a0f19; --accent-soft:#3a2230; --slate:#8fb0d4;
  --ok:#6fd3a0; --ok-soft:#1d3a2e; --warn:#f0c46a; --warn-soft:#3b3014; --bad:#f19a9d; --bad-soft:#40201f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:980px;margin:0 auto}
.notice{background:var(--warn-soft);color:var(--warn);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-top:16px;font-size:13px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:20px 0 12px}
.brand{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:.01em}
.brand small{display:block;font-family:var(--font-body);font-size:12px;font-weight:400;color:var(--muted);letter-spacing:.08em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);padding:8px 16px;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-family:var(--font-display);font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 20px;padding:0;list-style:none}
.steps li{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.steps li.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:700}
.steps li.done{color:var(--slate)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card.pick{cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.card.pick[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card h3{margin:0 0 4px;font-size:16px}
.meta{color:var(--muted);font-size:13px}
.price{font-variant-numeric:tabular-nums;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;min-width:84px;text-align:center}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=tel],input[type=number],select{width:100%;max-width:420px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}
.err{color:var(--bad);font-size:13px;min-height:20px;margin:6px 0 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 18px;border-radius:8px;font:inherit;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pay{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));max-width:520px}
.sum{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.sum dt{color:var(--muted)} .sum dd{margin:0;text-align:right}
.sms{background:var(--surface);border:1px dashed var(--accent);border-radius:12px;padding:12px 14px;max-width:360px;font-size:14px;white-space:pre-line}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;font-weight:700}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{font-size:12px;color:var(--muted);letter-spacing:.04em;font-weight:500}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;color:var(--muted);padding:10px 14px;font:inherit;cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--slate);padding:10px 14px;border-radius:6px;color:var(--muted);font-size:13px;margin-top:16px}
.small{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:90%}
@media (prefers-reduced-motion:no-preference){.card.pick,.chip,.btn{transition:border-color .15s,background .15s}}
</style>

<div class="wrap">
  <div class="notice" role="note">컨셉 데모입니다. 가상 브랜드와 가상 데이터로 만든 포트폴리오용 프로토타입이며 실제 결제와 문자 발송은 일어나지 않습니다.</div>
  <header class="top">
    <div class="brand">플리에 스튜디오<small>BALLET CLASS · RESERVATION</small></div>
    <div class="seg" role="group" aria-label="화면 전환">
      <button id="v-customer" aria-pressed="true" data-act="view" data-v="customer">고객 화면</button>
      <button id="v-admin" aria-pressed="false" data-act="view" data-v="admin">관리자 화면</button>
    </div>
  </header>
  <main id="app"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
window.APP_CONFIG={"url": "https://YOUR-PROJECT-REF.supabase.co", "anonKey": "YOUR-ANON-PUBLIC-KEY"};window.APP_VERSION="dev-HEAD";

/* ===== repo.js — 데이터 계층 (UI와 분리) =====
 * 화면 코드는 Repo 의 list/get/create/update/remove 만 호출합니다.
 * 저장소는 adapter 로 교체합니다.
 *   memory   : 가상 데이터(새로고침하면 초기화). DB 설정이 없거나 연결 실패 시 자동 폴백
 *   supabase : Supabase REST(PostgREST). config.json 의 url/anonKey 가 있을 때 사용
 * adapter 규약: load(col)->Promise<doc[]>, save(col,id,doc), drop(col,id), clear(col)
 */
var Repo=(function(){
  var COLMAP={when:'when_at'};            /* SQL 예약어 회피: JS 필드 -> DB 컬럼 */
  var COLREV={when_at:'when'};
  function snake(k){return k.replace(/[A-Z]/g,function(m){return '_'+m.toLowerCase()})}
  function camel(k){return k.replace(/_([a-z])/g,function(_,c){return c.toUpperCase()})}
  function colName(k){return COLMAP[k]||snake(k)}
  function fieldName(c){return COLREV[c]||camel(c)}

  function memoryAdapter(){
    var mem={};
    return {name:'memory',
      load:function(col){return Promise.resolve((mem[col]||[]).slice())},
      save:function(col,id,doc){(mem[col]=mem[col]||[]);var i=mem[col].findIndex(function(d){return d.id===id});if(i<0)mem[col].push(doc);else mem[col][i]=doc;return Promise.resolve()},
      drop:function(col,id){mem[col]=(mem[col]||[]).filter(function(d){return d.id!==id});return Promise.resolve()},
      clear:function(col){mem[col]=[];return Promise.resolve()}};
  }

  function supabaseAdapter(cfg,ns){
    var base=String(cfg.url).replace(/\/$/,'')+'/rest/v1/';
    var H={apikey:cfg.anonKey,Authorization:'Bearer '+cfg.anonKey,'Content-Type':'application/json'};
    function tbl(col){return ns+'_'+snake(col)}
    function toRow(doc){var r={};Object.keys(doc).forEach(function(k){r[colName(k)]=doc[k]});return r}
    function fromRow(row){var d={};Object.keys(row).forEach(function(c){d[fieldName(c)]=row[c]});return d}
    function check(res){if(!res.ok)return res.text().then(function(t){throw new Error('HTTP '+res.status+' '+t.slice(0,200))});return res}
    function ctl(){var c=new AbortController();setTimeout(function(){c.abort()},10000);return c.signal}
    return {name:'supabase',
      load:function(col){return fetch(base+tbl(col)+'?select=*&limit=1000',{headers:H,signal:ctl()}).then(check).then(function(r){return r.json()}).then(function(rows){return rows.map(fromRow)})},
      save:function(col,id,doc){return fetch(base+tbl(col)+'?on_conflict=id',{method:'POST',headers:Object.assign({Prefer:'resolution=merge-duplicates,return=minimal'},H),body:JSON.stringify(toRow(doc)),signal:ctl()}).then(check)},
      drop:function(col,id){return fetch(base+tbl(col)+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:H,signal:ctl()}).then(check)},
      clear:function(col){return fetch(base+tbl(col)+'?id=not.is.null',{method:'DELETE',headers:H,signal:ctl()}).then(check)}};
  }

  /* 설정(config.json -> window.APP_CONFIG)이 있으면 Supabase, 없으면 메모리 */
  function fromConfig(ns){
    var c=(typeof window!=='undefined'&&window.APP_CONFIG)||{};
    if(c.url&&c.anonKey&&String(c.url).indexOf('YOUR-')<0)return supabaseAdapter(c,ns);
    return memoryAdapter();
  }

  function make(adapter,seed){
    var cache={},seq={},q=Promise.resolve(),fails=0;
    function now(){return new Date().toISOString()}
    function persist(fn){q=q.then(fn).catch(function(e){fails++;console.warn('persist failed',e);if(api.onError)api.onError(e)});return q} /* 쓰기를 순서대로 */
    function nextId(col,prefix,start){seq[col]=Math.max(seq[col]||start,start);
      var max=(cache[col]||[]).reduce(function(m,d){var n=parseInt(String(d.id).replace(/\D/g,''),10);return n>m?n:m},0);
      if(max>=seq[col])seq[col]=max+1;
      var id=prefix+(seq[col]++);
      if(adapter.name==='supabase')id+='-'+Math.random().toString(36).slice(2,6); /* 동시 방문자 충돌 방지 */
      return id}
    function seedAll(){
      var s=seed();return Promise.all(Object.keys(s).map(function(col){
        cache[col]=s[col].map(function(d){return Object.assign({createdAt:now(),updatedAt:now()},d)});
        return Promise.all(cache[col].map(function(d){return adapter.save(col,d.id,d)}))}))}
    var api={
      mode:adapter.name,onError:null,
      init:function(cols){
        return Promise.all(cols.map(function(col){return adapter.load(col).then(function(rows){cache[col]=rows})}))
        .then(function(){var empty=cols.every(function(c){return !cache[c].length});if(empty&&seed)return seedAll()})
        .catch(function(e){ /* DB 연결 실패 -> 메모리로 폴백 */
          if(adapter.name==='memory')throw e;
          console.warn('DB 연결 실패, 메모리 모드로 전환',e);
          adapter=memoryAdapter();api.mode='memory';api.fallback=String(e.message||e);cache={};
          return api.init(cols)});
      },
      /* 모든 컬렉션을 비우고 시드를 다시 넣습니다 */
      reset:function(cols){
        return q.then(function(){return Promise.all(cols.map(function(c){return adapter.clear(c)}))}).then(function(){cache={};return seedAll()});
      },
      list:function(col,filter){var r=(cache[col]||[]);return (filter?r.filter(filter):r).slice()},
      get:function(col,id){return (cache[col]||[]).filter(function(d){return d.id===id})[0]||null},
      create:function(col,doc,prefix,start){var d=Object.assign({},doc);d.id=d.id||nextId(col,prefix||col[0]+'-',start||1);d.createdAt=d.updatedAt=now();(cache[col]=cache[col]||[]).push(d);persist(function(){return adapter.save(col,d.id,d)});return d},
      update:function(col,id,patch){var d=api.get(col,id);if(!d)return null;Object.assign(d,patch,{updatedAt:now()});persist(function(){return adapter.save(col,id,d)});return d},
      remove:function(col,id){cache[col]=(cache[col]||[]).filter(function(d){return d.id!==id});persist(function(){return adapter.drop(col,id)})}
    };
    return api;
  }

  /* 화면 하단의 저장소 상태 표시줄 + 데이터 초기화 버튼 */
  function mountStatus(repo,cols,rerender){
    var bar=document.createElement('div');
    bar.setAttribute('role','status');
    bar.style.cssText='margin:24px auto 0;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;font-size:12px;color:var(--muted,#666);border-top:1px solid var(--line,#ddd)';
    var txt=document.createElement('span');
    var ver=(typeof window!=='undefined'&&window.APP_VERSION)?' · '+window.APP_VERSION:'';
    txt.textContent=(repo.mode==='supabase'?'저장소: Supabase DB 연결됨 (방문자 공용 데이터)':'저장소: 브라우저 메모리 (가상 데이터, 새로고침하면 초기화)'+(repo.fallback?' · DB 연결 실패로 전환됨':''))+ver;
    var b=document.createElement('button');b.type='button';b.textContent='데이터 초기화';
    b.style.cssText='font:inherit;padding:4px 10px;border:1px solid var(--line,#ccc);border-radius:6px;background:var(--surface,transparent);color:var(--fg,inherit);cursor:pointer';
    b.onclick=function(){b.disabled=true;b.textContent='초기화 중…';repo.reset(cols).then(function(){b.disabled=false;b.textContent='데이터 초기화';rerender()}).catch(function(e){b.disabled=false;b.textContent='초기화 실패';console.warn(e)})};
    bar.appendChild(txt);bar.appendChild(b);document.body.appendChild(bar);
  }
  return {memoryAdapter:memoryAdapter,supabaseAdapter:supabaseAdapter,fromConfig:fromConfig,make:make,mountStatus:mountStatus,_map:{colName:colName,fieldName:fieldName,snake:snake}};
})();

/* ===== a-data.js — 스키마 + 가상 시드 (화면 코드와 분리) =====
 * 컬렉션
 *  instructors {id,name}
 *  classes     {id,name,level,instructorId,price}
 *  bookings    {id,classId,customerName,phone,parking,date(YYYY-MM-DD),slot,amount,payMethod,status}
 *  messages    {id,bookingId,body}
 *  rateJobs    {id,classIds[],mode,value,results{classId:ok|fail},status}
 * 모든 문서에 createdAt/updatedAt 자동 부여. 외래키는 id 로만 참조(이름 문자열 저장 금지).
 */
var COLS=['instructors','classes','bookings','messages','rateJobs'];
function isoDate(offset){var d=new Date();d.setDate(d.getDate()+offset);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function seedData(){
  return {
    instructors:[{id:'i1',name:'한서윤'},{id:'i2',name:'오지민'},{id:'i3',name:'윤하은'}],
    classes:[
      {id:'c1',name:'입문 발레 기초',level:'입문',instructorId:'i1',price:35000},
      {id:'c2',name:'성인 클래식 바워크',level:'초중급',instructorId:'i2',price:38000},
      {id:'c3',name:'포인트 워크 입문',level:'중급',instructorId:'i1',price:42000},
      {id:'c4',name:'바렐 스트레칭',level:'전체',instructorId:'i3',price:30000}
    ],
    bookings:[
      {id:'R-1042',classId:'c1',customerName:'김하린',phone:'010-1111-2222',parking:false,date:isoDate(1),slot:'19:30',amount:35000,payMethod:'카카오페이',status:'확정'},
      {id:'R-1043',classId:'c2',customerName:'이도윤',phone:'010-3333-4444',parking:false,date:isoDate(2),slot:'14:00',amount:38000,payMethod:'네이버페이',status:'확정'},
      {id:'R-1044',classId:'c4',customerName:'박서아',phone:'010-5555-6666',parking:true,date:isoDate(2),slot:'20:50',amount:30000,payMethod:'카카오페이',status:'대기'},
      {id:'R-1045',classId:'c3',customerName:'최유나',phone:'010-7777-8888',parking:false,date:isoDate(3),slot:'19:30',amount:42000,payMethod:'네이버페이',status:'취소'}
    ],
    messages:[],
    rateJobs:[]
  };
}

(function(){
var fmt=function(n){return n.toLocaleString('ko-KR')+'원'};
var DOW=['일','월','화','수','목','금','토'];
function mkDates(){var a=[];for(var i=1;a.length<7;i++){var iso=isoDate(i),x=new Date(iso+'T00:00:00');a.push({key:iso,label:(x.getMonth()+1)+'월 '+x.getDate()+'일 ('+DOW[x.getDay()]+')'})}return a}
var DATES=mkDates();
var SLOTS=['10:30','14:00','19:30','20:50'];
var repo=Repo.make(Repo.fromConfig('a'),seedData);
var S={view:'customer',step:1,cls:null,date:null,slot:null,name:'',phone:'',parking:false,pay:'naver',err:'',tab:'bookings',last:null,
  rate:{sel:{c1:true,c2:true,c3:false,c4:false},mode:'pct',val:10,jobId:null}};
var failOnce=true;
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},2400)}
function taken(date,slot){return (Number(date.slice(-2))+SLOTS.indexOf(slot))%4===0} /* 날짜마다 정확히 한 슬롯이 마감 */
function clsById(id){return repo.get('classes',id)}
function classes(){return repo.list('classes')}
function instrName(c){var i=repo.get('instructors',c.instructorId);return i?i.name:'-'}
function shortDate(iso){var p=iso.split('-');return Number(p[1])+'/'+Number(p[2])}
function whenOf(b){return shortDate(b.date)+' '+b.slot}
function bookings(){return repo.list('bookings')}
function messages(){return repo.list('messages').sort(function(a,b){return a.createdAt<b.createdAt?1:-1})}
function curJob(){return S.rate.jobId?repo.get('rateJobs',S.rate.jobId):null}

function stepper(){
  var n=['수업','일정','정보','결제','완료'];
  return '<ol class="steps" aria-label="예약 단계">'+n.map(function(t,i){var k=i+1;return '<li class="'+(k===S.step?'on':k<S.step?'done':'')+'"'+(k===S.step?' aria-current="step"':'')+'>'+k+'. '+t+'</li>'}).join('')+'</ol>'
}
function customer(){
  var h='<h2>수업 예약</h2><p class="sub">수업과 시간을 고르고 결제까지 한 번에 마칩니다.</p>'+stepper();
  if(S.step===1){
    h+='<div class="grid">'+classes().map(function(c){
      return '<button class="card pick" data-act="pickcls" data-id="'+c.id+'" aria-pressed="'+(S.cls===c.id)+'"><h3>'+esc(c.name)+'</h3><div class="meta">'+c.level+' · 강사 '+esc(instrName(c))+'</div><div class="price" style="margin-top:8px">'+fmt(c.price)+' <span class="meta">/ 1회</span></div></button>'}).join('')+'</div>';
    h+='<div class="row"><button class="btn primary" data-act="next" '+(S.cls?'':'disabled')+'>다음: 일정 선택</button></div>';
  }
  if(S.step===2){
    h+='<label class="f" id="lbl-date">날짜</label><div class="chips" role="group" aria-labelledby="lbl-date">'+DATES.map(function(d){return '<button class="chip" data-act="pickdate" data-k="'+d.key+'" aria-pressed="'+(S.date===d.key)+'">'+d.label+'</button>'}).join('')+'</div>';
    h+='<label class="f" id="lbl-slot">시간 (마감된 시간은 선택할 수 없습니다)</label><div class="chips" role="group" aria-labelledby="lbl-slot">'+SLOTS.map(function(s){var dis=!S.date||taken(S.date,s);return '<button class="chip" data-act="pickslot" data-s="'+s+'" '+(dis?'disabled':'')+' aria-pressed="'+(S.slot===s)+'">'+s+'</button>'}).join('')+'</div>';
    if(!S.date)h+='<p class="small">날짜를 먼저 선택하세요.</p>';
    h+='<div class="row"><button class="btn" data-act="back">이전</button><button class="btn primary" data-act="next" '+(S.date&&S.slot?'':'disabled')+'>다음: 정보 입력</button></div>';
  }
  if(S.step===3){
    h+='<label class="f" for="in-name">이름</label><input id="in-name" type="text" autocomplete="name" value="'+esc(S.name)+'" placeholder="예: 김하린">';
    h+='<label class="f" for="in-phone">휴대폰 번호 (예약 문자 수신)</label><input id="in-phone" type="tel" inputmode="numeric" value="'+esc(S.phone)+'" placeholder="010-0000-0000">';
    h+='<label class="f" style="display:flex;gap:8px;align-items:center;color:var(--fg)"><input id="in-park" type="checkbox" '+(S.parking?'checked':'')+'> 주차 지원이 필요합니다</label>';
    h+='<div class="note">주차 지원은 차량번호를 받아 주차 시스템에 등록하는 방식이 필요합니다. 외부 주차 서비스와 연동이 가능한지는 해당 서비스의 제휴 방식 확인 후 범위와 비용을 확정합니다. 이 데모에서는 요청만 기록합니다.</div>';
    h+='<p class="err" id="err" role="alert">'+esc(S.err)+'</p>';
    h+='<div class="row" style="margin-top:4px"><button class="btn" data-act="back">이전</button><button class="btn primary" data-act="next">다음: 결제</button></div>';
  }
  if(S.step===4){
    var c=clsById(S.cls);
    h+='<div class="card" style="max-width:520px"><dl class="sum"><dt>수업</dt><dd>'+esc(c.name)+'</dd><dt>일정</dt><dd>'+shortDate(S.date)+' '+S.slot+'</dd><dt>예약자</dt><dd>'+esc(S.name)+'</dd><dt>주차 지원</dt><dd>'+(S.parking?'요청':'없음')+'</dd><dt>결제 금액</dt><dd class="price">'+fmt(c.price)+'</dd></dl></div>';
    h+='<label class="f" id="lbl-pay">결제 수단 (가상)</label><div class="pay" role="group" aria-labelledby="lbl-pay"><button class="card pick" data-act="pickpay" data-p="naver" aria-pressed="'+(S.pay==='naver')+'"><b>네이버페이</b><div class="meta">간편결제 화면 예시</div></button><button class="card pick" data-act="pickpay" data-p="kakao" aria-pressed="'+(S.pay==='kakao')+'"><b>카카오페이</b><div class="meta">간편결제 화면 예시</div></button></div>';
    h+='<div class="row"><button class="btn" data-act="back">이전</button><button class="btn primary" data-act="pay">'+fmt(c.price)+' 결제하기 (가상)</button></div>';
  }
  if(S.step===5&&S.last){
    var b=repo.get('bookings',S.last);
    h+='<div class="card" style="max-width:520px"><span class="tag ok">예약 완료</span><h3 style="margin-top:8px">예약번호 '+b.id+'</h3><div class="meta">'+esc(clsById(b.classId).name)+' · '+whenOf(b)+'</div></div>';
    h+='<h2 style="font-size:17px;margin-top:20px">발송되는 예약 문자 (미리보기)</h2><div class="sms">'+esc((messages()[0]||{}).body||'')+'</div>';
    h+='<p class="small">관리자 화면의 예약 목록에 방금 예약이 추가되었습니다.</p>';
    h+='<div class="row"><button class="btn primary" data-act="again">새 예약 만들기</button><button class="btn" data-act="view" data-v="admin">관리자 화면에서 보기</button></div>';
  }
  return h
}
function statusTag(s){return '<span class="tag '+(s==='확정'?'ok':s==='대기'?'warn':'bad')+'">'+s+'</span>'}
function admin(){
  var tabs=[['bookings','예약 목록'],['rates','요금 일괄 변경'],['sms','알림 기록']];
  var h='<h2>관리자</h2><p class="sub">예약 현황을 확인하고 수업 요금을 한 번에 바꿉니다.</p><div class="tabs" role="tablist">'+tabs.map(function(t){return '<button role="tab" data-act="tab" data-t="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+t[1]+'</button>'}).join('')+'</div>';
  if(S.tab==='bookings'){
    var BK=bookings(),ok=BK.filter(function(b){return b.status==='확정'}),sum=ok.reduce(function(a,b){return a+b.amount},0);
    h+='<div class="stats"><div class="card stat"><span class="meta">전체 예약</span><b>'+BK.length+'</b></div><div class="card stat"><span class="meta">확정</span><b>'+ok.length+'</b></div><div class="card stat"><span class="meta">확정 매출</span><b>'+fmt(sum)+'</b></div></div>';
    h+='<div class="tablewrap"><table><thead><tr><th>예약번호</th><th>예약자</th><th>수업</th><th>일정</th><th class="num">금액</th><th>상태</th><th>처리</th></tr></thead><tbody>'+
    BK.slice().reverse().map(function(b){return '<tr><td>'+b.id+'</td><td>'+esc(b.customerName)+'</td><td>'+esc(clsById(b.classId).name)+'</td><td>'+whenOf(b)+'</td><td class="num">'+fmt(b.amount)+'</td><td>'+statusTag(b.status)+'</td><td>'+(b.status==='취소'?'<span class="small">-</span>':(b.status==='대기'?'<button class="btn" data-act="bstat" data-id="'+b.id+'" data-s="확정">확정</button> ':'')+'<button class="btn" data-act="bstat" data-id="'+b.id+'" data-s="취소">취소</button>')+'</td></tr>'}).join('')+'</tbody></table></div>';
  }
  if(S.tab==='rates'){
    var r=S.rate;
    h+='<div class="card"><b>1. 대상 수업 선택</b><div style="margin-top:8px;display:grid;gap:6px">'+classes().map(function(c){return '<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-act="rsel" data-id="'+c.id+'" '+(r.sel[c.id]?'checked':'')+'> '+esc(c.name)+' <span class="meta">현재 '+fmt(c.price)+'</span></label>'}).join('')+'</div>'+
    '<b style="display:block;margin-top:16px">2. 변경 방식</b><div class="row" style="margin-top:8px"><select id="r-mode" aria-label="변경 방식" style="max-width:200px"><option value="pct"'+(r.mode==='pct'?' selected':'')+'>비율(%)로 변경</option><option value="won"'+(r.mode==='won'?' selected':'')+'>금액(원)으로 변경</option></select><input id="r-val" type="number" aria-label="변경 값" value="'+r.val+'" style="max-width:140px"><span class="meta">음수를 입력하면 인하됩니다</span></div></div>';
    var job=curJob(),rows=classes().filter(function(c){return r.sel[c.id]}).map(function(c){var np=calc(c.price);return {c:c,np:np}});
    h+='<h2 style="font-size:17px;margin-top:20px">3. 전송 전 미리보기</h2>';
    if(!rows.length)h+='<p class="meta">대상 수업을 한 개 이상 선택하세요.</p>';
    else h+='<div class="tablewrap"><table><thead><tr><th>수업</th><th class="num">변경 전</th><th class="num">변경 후</th><th>상태</th></tr></thead><tbody>'+rows.map(function(x){var st=job&&job.results[x.c.id];return '<tr><td>'+esc(x.c.name)+'</td><td class="num">'+fmt(x.c.price)+'</td><td class="num"><b>'+(x.np<1000?'<span class="tag bad">1,000원 미만</span>':fmt(x.np))+'</b></td><td>'+(st?(st==='ok'?'<span class="tag ok">반영 완료</span>':st==='fail'?'<span class="tag bad">전송 실패</span>':'<span class="tag warn">대기</span>'):'<span class="small">미적용</span>')+'</td></tr>'}).join('')+'</tbody></table></div>';
    var failed=job&&Object.keys(job.results).filter(function(k){return job.results[k]==='fail'}).length;
    h+='<div class="row"><button class="btn primary" data-act="rapply" '+((!rows.length||(job&&!failed)||rows.some(function(x){return x.np<1000}))?'disabled':'')+'>변경 적용</button>'+(failed?'<button class="btn" data-act="rretry">실패한 '+failed+'건만 다시 전송</button>':'')+(job&&!failed?'<span class="small">이미 적용된 변경입니다. 값을 바꾸면 다시 적용할 수 있습니다.</span>':'')+'</div>';
    h+='<div class="note">중복 실행 차단, 전송 전 미리보기, 실패 항목만 재전송하는 흐름을 보여주는 화면입니다. 실제 서비스에서는 각 단계(내부 저장, 외부 접수, 재조회 확인)를 항목별로 기록합니다.</div>';
  }
  if(S.tab==='sms'){
    var MS=messages();h+=MS.length?MS.map(function(m){return '<div class="sms" style="margin-bottom:10px">'+esc(m.body)+'</div>'}).join(''):'<p class="meta">아직 발송 기록이 없습니다. 고객 화면에서 예약을 완료하면 이곳에 쌓입니다.</p>';
  }
  return h
}
function calc(p){var r=S.rate,v=Number(r.val)||0;return Math.round(r.mode==='pct'?p*(1+v/100):p+v)}
function render(){
  $('#v-customer').setAttribute('aria-pressed',S.view==='customer');$('#v-admin').setAttribute('aria-pressed',S.view==='admin');
  $('#app').innerHTML=S.view==='customer'?customer():admin();
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;var a=t.dataset.act;
  if(a==='rsel'){S.rate.sel[t.dataset.id]=t.checked;S.rate.jobId=null;render();return}
  if(a==='view'){S.view=t.dataset.v;render();return}
  if(a==='pickcls'){S.cls=t.dataset.id}
  else if(a==='pickdate'){S.date=t.dataset.k;S.slot=null}
  else if(a==='pickslot'){S.slot=t.dataset.s}
  else if(a==='pickpay'){S.pay=t.dataset.p}
  else if(a==='back'){S.step--;S.err=''}
  else if(a==='next'){
    if(S.step===3){
      if(S.name.trim().length<2){S.err='이름을 2자 이상 입력해 주세요.';render();return}
      if(!/^01[016789]-?\d{3,4}-?\d{4}$/.test(S.phone.trim())){S.err='휴대폰 번호 형식을 확인해 주세요. 예: 010-1234-5678';render();return}
    }
    S.err='';S.step++
  }
  else if(a==='pay'){
    var c=clsById(S.cls),when=shortDate(S.date)+' '+S.slot;
    var b=repo.create('bookings',{classId:c.id,customerName:S.name.trim(),phone:S.phone.trim(),parking:S.parking,date:S.date,slot:S.slot,amount:c.price,payMethod:S.pay==='naver'?'네이버페이':'카카오페이',status:'확정'},'R-',1046);
    S.last=b.id;
    repo.create('messages',{bookingId:b.id,body:'[플리에 스튜디오] '+b.customerName+'님, 예약이 확정되었습니다.\n수업: '+c.name+'\n일정: '+when+'\n예약번호: '+b.id+'\n수업 1시간 전에 알림을 한 번 더 보내드립니다.'},'M-',1);
    S.step=5;toast('결제가 완료되었습니다 (가상)')
  }
  else if(a==='again'){S.step=1;S.cls=S.date=S.slot=null;S.name=S.phone='';S.parking=false}
  else if(a==='tab'){S.tab=t.dataset.t}
  else if(a==='bstat'){repo.update('bookings',t.dataset.id,{status:t.dataset.s});toast('예약 상태를 '+t.dataset.s+'(으)로 바꿨습니다')}
  else if(a==='rapply'){
    var r=S.rate,res={},n=0;
    classes().forEach(function(c){if(r.sel[c.id]){n++;if(failOnce&&n===2){res[c.id]='fail'}else{res[c.id]='ok';repo.update('classes',c.id,{price:calc(c.price)})}}});
    failOnce=false;
    var jb=repo.create('rateJobs',{classIds:Object.keys(res),mode:r.mode,value:Number(r.val)||0,results:res,status:Object.keys(res).some(function(k){return res[k]==='fail'})?'partial':'done'},'J-',1);
    r.jobId=jb.id;toast(jb.status==='partial'?'일부 항목 전송에 실패했습니다':'모든 항목을 반영했습니다')
  }
  else if(a==='rretry'){
    var jb2=curJob(),res2=Object.assign({},jb2.results);
    Object.keys(res2).forEach(function(k){if(res2[k]==='fail'){res2[k]='ok';repo.update('classes',k,{price:calc(clsById(k).price)})}});
    repo.update('rateJobs',jb2.id,{results:res2,status:'done'});toast('실패한 항목만 다시 전송했습니다')
  }
  else return;
  render();
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='in-name')S.name=t.value;
  if(t.id==='in-phone')S.phone=t.value;
  if(t.id==='in-park')S.parking=t.checked;
  if(t.id==='r-mode'){S.rate.mode=t.value;S.rate.jobId=null;render()}
  if(t.id==='r-val'){S.rate.val=t.value;S.rate.jobId=null;var p=t.selectionStart;render();var n=$('#r-val');if(n){n.focus()}}
});
repo.init(COLS).then(function(){render();Repo.mountStatus(repo,COLS,function(){S.step=1;S.cls=S.date=S.slot=null;S.rate.jobId=null;render()})});
})();

</script>
