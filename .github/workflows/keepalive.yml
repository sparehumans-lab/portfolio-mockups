# 무료 Supabase 프로젝트가 7일 무활동으로 일시 중지되지 않도록 매일 가벼운 조회를 보냅니다.
# 저장소 Settings > Secrets and variables > Actions 에 PROD_SUPABASE_URL, PROD_SUPABASE_ANON_KEY 를 등록하세요.
name: keepalive
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: DB 조회
        env:
          URL: ${{ secrets.PROD_SUPABASE_URL }}
          KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
        run: |
          curl -fsS "$URL/rest/v1/a_classes?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
